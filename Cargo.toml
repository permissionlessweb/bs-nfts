[workspace]
members = [
 "packages/*", 
 "contracts/collections/*",
 "contracts/minters/*",
 "contracts/factories/*",
 "scripts"
 ]

[workspace.package]
version       = "0.3.0"
edition       = "2021"
license       = "Apache-2.0"
repository    = "https://github.com/bitsongofficial/bs-nfts"
homepage      = "https://bitsong.io"
documentation = "https://docs.bitsong.io"

[workspace.dependencies]
anyhow                       = { version = "1.0" }
bs721                        = {  path = "./packages/bs721" }
bs721-base                   = {  path = "./contracts/collections/bs721-base" }
bs721-curve                  = {  path = "./contracts/collections/bs721-curve" }
bs721-royalties              = {  path = "./contracts/collections/bs721-royalties" }
bs721-launchparty            = {  path = "./contracts/minters/bs721-launchparty" }
bs721-factory                = {  path = "./contracts/factories/bs721-factory" }
bs-controllers               = {  path = "./packages/controllers" }
btsg-auth                    = {  git  = "https://github.com/permissionlessweb/bs-accounts", package = "btsg-auth", branch = "cleanup" }
btsg-wavs                    = {  git  = "https://github.com/permissionlessweb/bs-accounts", library = "btsg-wavs", branch = "cleanup", features = ["library"] }
cosmos-sdk-proto             = { git   = "https://github.com/permissionlessweb/cosmos-rust", default-features = false }
cosmwasm-schema              = "2.2.0"
cosmwasm-std                 = "2.2.0"
cw-controllers               = "2.0.0"
cw2                          = "2.0.0"
cw20                         = "2.0.0"
cw-multi-test                = {version = "2.2.0",features = ["stargate", "cosmwasm_2_1"]}
cw-orch                      = "0.26.0"
cw-ownable                   = "2.1.0"
cw-storage-macro             = "2.0.0"
cw-storage-plus = "2.0.0"
cw-utils = "2.0.0"
schemars = "0.8.21"
serde                        = { version = "1.0.140", default-features = false, features = ["derive"] }
serde_json                   = "1.0.79"
sha2                         = "0.10.8"
thiserror                    = "1.0.31"
url                          = "2.2.2"

[profile.release.package.bs721-base]
codegen-units = 1
incremental = false

[profile.release.package.bs721-curve]
codegen-units = 1
incremental = false

[profile.release.package.bs721-factory]
codegen-units = 1
incremental = false

[profile.release.package.bs721-launchparty]
codegen-units = 1
incremental = false

[profile.release.package.bs721-royalties]
codegen-units = 1
incremental = false

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
