[workspace]
members = [
 "packages/*", 
 "contracts/collections/*",
 "contracts/minters/*",
 "contracts/factories/*",
 # "scripts",
 # "test-suite"
 ]

[workspace.package]
version       = "0.4.0"
edition       = "2021"
license       = "Apache-2.0"
repository    = "https://github.com/bitsongofficial/bs-nfts"
homepage      = "https://bitsong.io"
documentation = "https://docs.bitsong.io"

[workspace.dependencies]
bs721-base                   = { path = "./contracts/collections/bs721-base" }
bs721-curve                  = { path = "./contracts/collections/bs721-curve" }
bs721-factory                = { path = "./contracts/factories/bs721-factory" }
bs721-launchparty            = { path = "./contracts/minters/bs721-launchparty" }
bs721-royalties              = { path = "./contracts/collections/bs721-royalties" }
bs721                        = { path = "./packages/bs721" }
easy-addr                    = { path = "./packages/easy-addr" }
bs-controllers               = { path = "./packages/controllers" }
btsg-nft-scripts             = { path = "./scripts" }


cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
cosmwasm-schema                = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp", package = "cosmwasm-schema" }
cw2                          = { git = "https://github.com/permissionlessweb/cw-minus", branch = "mvp", package = "cw2" }
cw-storage-plus              = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp" }
btsg-auth                    = { git = "https://github.com/permissionlessweb/bs-accounts", package = "btsg-auth", branch = "mvp" }
btsg-wavs                    = { git = "https://github.com/permissionlessweb/bs-accounts", package = "btsg-wavs", branch = "mvp", features = ["library"] }
cosmos-sdk-proto             = { git = "https://github.com/permissionlessweb/cosmos-rust", default-features = false }
cw-utils                     = { git = "https://github.com/permissionlessweb/cw-minus", branch = "mvp", package = "cw-utils" }
cw-storage-macro             = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp", package = "cw-storage-macro" }

anyhow                       = { version = "1.0" }
schemars                     = { version = "0.8.21" }
serde                        = { version = "1.0.140", default-features = false, features = ["derive"] }
serde_json                   = { version = "1.0.79" }
sha2                         = { version = "0.10.8" }
thiserror                    = { version = "1.0.31" }
url                          = { version = "2.2.2" }

# dev dependencies
cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test", branch = "mvp", features = ["stargate", "cosmwasm_2_1"] }
[profile.release.package.bs721-base]
codegen-units = 1
incremental = false

[profile.release.package.bs721-curve]
codegen-units = 1
incremental = false

[profile.release.package.bs721-factory]
codegen-units = 1
incremental = false

[profile.release.package.bs721-launchparty]
codegen-units = 1
incremental = false

[profile.release.package.bs721-royalties]
codegen-units = 1
incremental = false

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
